; The Clinker, the Hollow's mid-boss (ART_DIRECTION §2.4): 32 x 32, foot anchor, one 4 x 6 key-pose sheet
; (Gemini, 2026-11-28; pending the owner's look at the previews, DECISIONS).
;   godot --headless --path . -s tools/art/sprite_from_sheet.gd -- <sheet.jpg> tools/art/manifests/clinker.cfg
; Layout (tools/art/samples/clinker_keyposes_grid.jpg; thin dark purple grid lines, so key_mode = "hue"):
;   row 1: asleep (curled flat, eyes shut), asleep breathing, waking (uncurling), awake standing
;   row 2: idle, idle, trundle step, trundle step
;   row 3: curl wind-up: crouch, hunch, ball with the face tucking, ball tucked (eyes hidden)
;   row 4: a partly curled ball with its face out, then three frames of the rolling ball
;   row 5: dizzy recover: stand, spiral eyes, spiral eyes with wobble marks, eyes back with wobble marks
;   row 6: hurt flinch, plates cracking (bright cracks), cracked open into rubble, rubble with smoke (death)
; Row 4's first cell is the curl's middle (face still out, between the hunch and the face tucking), so the
; wind-up is 5 frames with the eyes visible to the last; the roll is the three ball cells, two of them also
; turned half round so the plates go top, right, bottom, left: one full clockwise turn (rolling right).
; Size: 32 x 32 (the mid-boss class, §1.2). The code body is about 48 px across (body_radius 25) and the roll hits
; at 22 px. At fill 0.8 the standing pose is 24 x 19 source px (48 x 38 on screen) and the rolling ball 19 x 19 (38):
; the sprite matches the hitbox, with headroom in the frame for the death's smoke. (A 24 x 24 frame would fit the
; same size but leaves the eyes and plates no room.)

[sheet]
subject = "clinker"
kind = "creature"
role = "creature"
rows = 6
cols = 4
frame_size = 32
anchor = "foot"
facing = "right"
layout = "grid"
margin = 6
key_mode = "hue"
rim = "elite"
sway = false
fill = 0.8

[cells]
r0c0 = "sleep"
r0c1 = "sleep"
r0c2 = "wake"
r0c3 = "wake"
r1c0 = "idle"
r1c1 = "idle"
r1c2 = "move"
r1c3 = "move"
r2c0 = "windup"
r2c1 = "windup"
r2c2 = "windup"
r2c3 = "windup"
r3c0 = "windup"
r3c1 = "roll"
r3c2 = "roll"
r3c3 = "roll"
r4c0 = "recover"
r4c1 = "recover"
r4c2 = "recover"
r4c3 = "recover"
r5c0 = "hurt"
r5c1 = "crack"
r5c2 = "death"
r5c3 = "death"

; Asleep: eyes shut (no eye repair).
[cell.r0c0]
eyes = 0

[cell.r0c1]
eyes = 0

; Tucked: the eyes are hidden. Two of the rolling ball's cells hide the face too (a pale claw tip is not an eye).
[cell.r2c3]
eyes = 0

[cell.r3c1]
eyes = 0

[cell.r3c3]
eyes = 0

; The rubble and the smoke: no eyes left.
[cell.r5c2]
eyes = 0

[cell.r5c3]
eyes = 0

[pose.base.sleep]
derive = []

; Uncurling: the breathing sleep frame, waking, waking, standing.
[pose.base.wake]
sequence = ["sleep 1", "0", "0", "1"]
derive = []

; Two breathing keys, each held two frames.
[pose.base.idle]
sequence = ["0", "0", "1", "1"]
derive = []

; The trundle: two steps, each held two frames (it is slow: 40 px/s).
[pose.base.move]
sequence = ["0", "0", "1", "1"]
derive = []

; Crouch, hunch, ball with the face out (row 4's first cell), face tucking, tucked.
[pose.base.windup]
sequence = ["0", "1", "4", "2", "3"]
derive = []

; One full clockwise turn: plates top (cell 2 turned), right, bottom, left (cell 3 turned).
[pose.base.roll]
sequence = ["1 r180", "0", "1", "2 r180"]
derive = []

[pose.base.recover]
derive = []

; The flinch: a pale flash of it, then the flinch.
[pose.base.hurt]
rule = "hurt"
derive = []

; The shell cracking (it regrows; the Clinker stays up): flinch, then the bright cracks held.
[pose.base.crack]
sequence = ["hurt 0", "0", "0", "0"]
derive = []

; Death: cracks, cracked open, rubble, then the smoke escaping (held).
[pose.base.death]
sequence = ["crack 0", "0", "0", "1", "1", "1"]
derive = []

[anim.sleep]
fps = 2.0
loop = true

[anim.wake]
fps = 8.0
loop = false
timed_by = "kl_clinker_wake_time"

[anim.idle]
fps = 6.0
loop = true

[anim.move]
fps = 8.0
loop = true

[anim.windup]
fps = 8.0
loop = false
timed_by = "kl_clinker_roll_tell"

[anim.roll]
fps = 16.0
loop = true

[anim.recover]
fps = 8.0
loop = false
timed_by = "kl_clinker_recover"

[anim.hurt]
fps = 12.0
loop = false

[anim.crack]
fps = 12.0
loop = false

[anim.death]
fps = 10.0
loop = false
