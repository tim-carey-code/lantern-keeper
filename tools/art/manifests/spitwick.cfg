; The Spitwick (ART_DIRECTION §2.2), from the shared Spitwick + nest sheet
; (tools/art/samples/spitwick_nest_keyposes_grid.jpg: row 1 Spitwick, row 2 nest; nest.cfg reads row 2).
;   godot --headless --path . -s tools/art/sprite_from_sheet.gd -- <sheet.jpg> tools/art/manifests/spitwick.cfg
; The rows are not equal-height cells (the Spitwick row is taller), so the layout is found from the content:
; row bands split by clear magenta, then column bands in each row.
; A tall, narrow drip: a 16 x 32 frame, anchored at the foot.

[sheet]
subject = "spitwick"
kind = "creature"
layout = "auto"
; Dark magenta ground shadows under the subjects: clear them too.
key_mode = "hue"
rows = 2
cols = 4
frame_size = Vector2i(16, 32)
anchor = "foot"
facing = "right"
rim = "small"

[cells]
r0c0 = "idle"
r0c1 = "windup"
r0c2 = "attack"
r0c3 = "recover"
r1c0 = "skip"
r1c1 = "skip"
r1c2 = "skip"
r1c3 = "skip"

; The spit glob in the attack cell is drawn by code in the game (spit_projectile.gd): keep only the body.
[cell.r0c2]
keep = "largest"

; Its wind-up is keyed, so the attack derives nothing.
[pose.base.attack]
derive = []

[anim.windup]
fps = 8.0
loop = false
timed_by = "kl_spit_tell"

[anim.attack]
fps = 14.0
loop = false
