; The keeper's poses (ART_DIRECTION §3.1): 32 x 32 frames, a 1 px #141a2e outline. Role "keeper": the darks,
; the world blues, the ambers, wood and skin.
;   godot --headless --path . -s tools/art/sprite_from_sheet.gd -- <sheet.jpg> tools/art/manifests/keeper_poses.cfg
; Layout (tools/art/samples/keeper_keyposes_grid_v2.jpg, 2 x 4, the crook in every pose):
;   row 1: idle, move (walk), thrust (a spark leaves the lamp), lob (a fireball arcs above)
;   row 2: dash, drink, hurt (a flinch, an arm raised), kindle (kneels by a small floor lantern)
; The first sheet (keeper_keyposes_grid.jpg) had dark purple grid lines: key_mode = "hue" clears them.
; Drawn facing right only. The strips go to assets/art/keeper/keeper_<anim>.png. Careful: once keeper_idle.png
; is there, the keeper's art hook (player.gd) shows it instead of the Puny sheet in every direction (flipped for
; left). See tools/art/README.md, "The keeper".

[sheet]
subject = "keeper"
kind = "keeper"
role = "keeper"
rows = 2
cols = 4
frame_size = 32
anchor = "foot"
facing = "right"
; The dark purple grid lines key out with the magenta.
key_mode = "hue"
margin = 4
; Fireballs, sparks and props are drawn by code or are their own sprites: keep the keeper's body (and what
; touches it: the crook, the lamp, the satchel).
keep = "largest"
; The figure is about 16 x 24 inside the 32 x 32 frame (ART_DIRECTION §1.2), like the Puny keeper.
fill = 0.8

[cells]
r0c0 = "idle"
r0c1 = "move"
r0c2 = "thrust"
r0c3 = "lob"
r1c0 = "dash"
r1c1 = "drink"
r1c2 = "hurt"
r1c3 = "kindle"

; The kindle cell's floor lantern is a separate shape, so keep = "largest" drops it. For the first sheet (v1),
; where a stone post touches the keeper's flame, crop the cell instead: uncomment the region (fractions of the cell).
;[cell.r1c3]
;region = [0.0, 0.0, 0.62, 1.0]

; The keeper's own hurt is keyed; the idle derives nothing (no death or spawn for the keeper).
[pose.base.idle]
derive = []

[anim.idle]
fps = 3.0
loop = true

[anim.move]
fps = 8.0
loop = true

[anim.kindle]
fps = 8.0
loop = false
