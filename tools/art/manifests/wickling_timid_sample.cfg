; The first pilot sample (tools/art/samples/wickling_timid_strip_sample.jpg): one row of four timid Wickling idle
; frames. Four cells with the same pose make one hand-keyed strip of those four frames (no auto bob); the rest
; (hurt, death, spawn, notice) derive from the first.
;   godot --headless --path . -s tools/art/sprite_from_sheet.gd -- tools/art/samples/wickling_timid_strip_sample.jpg \
;     tools/art/manifests/wickling_timid_sample.cfg --out ~/.cache/openclaw/project-scratch/sprite-out/

[sheet]
subject = "wickling"
kind = "creature"
; Role "creature": the darks, the world blues and #a3bcd4 only.
role = "creature"
rows = 1
cols = 4
frame_size = 16
anchor = "center"
rim = "small"

[cells]
r0c0 = "timid/idle"
r0c1 = "timid/idle"
r0c2 = "timid/idle"
r0c3 = "timid/idle"
