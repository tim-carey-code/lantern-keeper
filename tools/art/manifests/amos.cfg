; Amos, the trader (ART_DIRECTION §3.3): a person, 32 x 32, foot anchor, a 1 px #141a2e outline (people get an
; outline, not a rim), the full palette.
;   godot --headless --path . -s tools/art/sprite_from_sheet.gd -- <sheet.jpg> tools/art/manifests/amos.cfg
; Layout (tools/art/samples/amos_keyposes_grid.jpg, 2 x 4, facing right):
;   row 1: idle, move (walk), talk (a hand raised), wave
;   row 2: push (with the cart), give (holding out an amber oil flask), laugh, the cart on its own
; The strips go to assets/art/people/amos/amos_<anim>.png; the cart is a still prop, amos_cart.png (48 x 32),
; not listed in amos.frames.cfg. (assets/art/landmarks/cart.png, the 32 x 32 placeholder, is left alone.)
; The poses touch their neighbours' columns, so cells are found as connected shapes.
; People's eyes are dark dots, never the creatures' pale blue: no eye repair.

[sheet]
subject = "amos"
kind = "person"
layout = "components"
rows = 2
cols = 4
frame_size = 32
anchor = "foot"
facing = "right"
outline = true
rim = "none"
eyes = 0
; The figure is about 16 x 24 inside the frame, the same as the keeper.
fill = 0.8
; Skin tones and green glass are not in the 14 colours: faces and hands snap to the warm skin pair, green
; bottles to the flask ambers.
recolour = {"skin": ["#d9772b", "#9c4a22"], "green": ["#ffd27a", "#f5a742", "#d9772b"]}

[cells]
r0c0 = "idle"
r0c1 = "move"
r0c2 = "talk"
r0c3 = "wave"
r1c0 = "push"
r1c1 = "give"
r1c2 = "laugh"
r1c3 = "cart/cart"

; Talk: the key pose with a gentle 1 px bob, 2 frames.
[pose.base.talk]
rule = "move"
frames = 2

; Pushing the cart is wide: fit it by itself (Amos is drawn smaller in it).
[pose.base.push]
fit = "own"

[variant.cart]
frame_size = Vector2i(48, 32)
fill = 1.0

[pose.cart.cart]
rule = "hold"
prop = true
file = "amos_cart"

[anim.idle]
fps = 4.0
loop = true

[anim.move]
fps = 8.0
loop = true

[anim.talk]
fps = 6.0
loop = true

[anim.wave]
fps = 6.0
loop = false

[anim.push]
fps = 6.0
loop = false

[anim.give]
fps = 6.0
loop = false

[anim.laugh]
fps = 6.0
loop = false
