; Amos, the trader (ART_DIRECTION §3.3): a person, 32 x 32, 1 px #141a2e outline, the full palette.
;   godot --headless --path . -s tools/art/sprite_from_sheet.gd -- <sheet.jpg> tools/art/manifests/amos.cfg
; Ask for one row of three cells, facing right: idle (rocking on the heels, a glance at the dark), talk (a hand
; gesture), trade (leaning on the cart). The strips go to assets/art/people/amos/amos_<anim>.png.
; People's eyes are dark dots, never the creatures' pale blue: no eye repair. No sheet yet.

[sheet]
subject = "amos"
kind = "person"
rows = 1
cols = 3
frame_size = 32
anchor = "foot"
facing = "right"
; The figure is about 16 x 24 inside the frame, the same as the keeper.
fill = 0.8
; If the cart is drawn in the trade cell, keep only the figure (the cart is its own sprite, landmarks/cart.png).
keep = "largest"

[cells]
r0c0 = "idle"
r0c1 = "talk"
r0c2 = "trade"

; Talk: the key pose with a gentle 1 px bob, 2 frames.
[pose.base.talk]
rule = "move"
frames = 2

[anim.idle]
fps = 4.0
loop = true

[anim.talk]
fps = 6.0
loop = true

[anim.trade]
fps = 4.0
loop = false
