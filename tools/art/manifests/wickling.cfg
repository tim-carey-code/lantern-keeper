; The Wickling family (ART_DIRECTION §2.1): one 3 x 4 key-pose sheet.
;   godot --headless --path . -s tools/art/sprite_from_sheet.gd -- <sheet.jpg> tools/art/manifests/wickling.cfg
; Layout (the owner's sheet tools/art/samples/wicklings_keyposes_grid.jpg):
;   row 1, timid: idle, drift (move), notice (eyes flared), flee (stretched, eyes narrowed)
;   row 2, brave: idle, drift, notice, reach (the latch: "attack"; its wind-up is derived from it)
;   row 3, elite: idle (cold-lantern shell), shell cracking, shell falling apart, the shell-less body
; The two crack cells are two hand keys of one "crack" strip. The shell-less body is the "elite_broken" variant,
; so Art.frames("wickling", "elite_broken") finds it. Options: tools/art/README.md.

[sheet]
subject = "wickling"
kind = "creature"
; Role "creature": the darks, the world blues and #a3bcd4 only.
role = "creature"
rows = 3
cols = 4
frame_size = 16
anchor = "center"
facing = "right"

[cells]
r0c0 = "timid/idle"
r0c1 = "timid/move"
r0c2 = "timid/notice"
r0c3 = "timid/flee"
r1c0 = "brave/idle"
r1c1 = "brave/move"
r1c2 = "brave/notice"
r1c3 = "brave/attack"
r2c0 = "elite/idle"
r2c1 = "elite/crack"
r2c2 = "elite/crack"
r2c3 = "elite_broken/idle"

[variant.timid]
rim = "small"

[variant.brave]
rim = "small"

[variant.elite]
frame_size = 24
rim = "elite"
; The eyes glow through the glass at about 0.6 brightness; the shell stays under 0.45.
eye_threshold = 0.5
; Lift the grimy shell a step so it snaps to the lighter blues instead of the body's near-black.
gain = 1.3

[variant.elite_broken]
frame_size = 24
rim = "elite"

; The flee is two frames with a quick bob (no sway).
[pose.timid.flee]
rule = "move"
frames = 2
fit = "own"

; The reach is long and wide: fit it by itself so it doesn't shrink the brave's other poses.
[pose.brave.attack]
fit = "own"

; The flared-eye notice keys are drawn already; still add the 1 px flare as frame 2.
[pose.timid.notice]
rule = "notice"

[pose.brave.notice]
rule = "notice"

; The shell-less body has no hurt, death or spawn of its own yet (the elite's death covers it).
[pose.elite_broken.idle]
derive = []

[anim.idle]
fps = 6.0
loop = true

[anim.move]
fps = 8.0
loop = true

[anim.flee]
fps = 10.0
loop = true

[anim.crack]
fps = 12.0
loop = false
