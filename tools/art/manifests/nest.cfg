; The nest (ART_DIRECTION §2.3), row 2 of the shared Spitwick + nest sheet (spitwick.cfg reads row 1).
;   godot --headless --path . -s tools/art/sprite_from_sheet.gd -- <sheet.jpg> tools/art/manifests/nest.cfg
; Poses: dormant (idle), glowing before a hatch (windup), hatching (attack), collapsing (death, keyed).
; Frame: the art bible says 32 x 32 for nests; this sheet's nest is low and wide, so 32 x 24 wastes less of the
; frame and keeps it bigger. Change frame_size to Vector2i(32, 32) to follow the bible exactly.

[sheet]
subject = "nest"
kind = "creature"
layout = "auto"
; Dark magenta ground shadows under the subjects: clear them too.
key_mode = "hue"
rows = 2
cols = 4
frame_size = Vector2i(32, 24)
anchor = "foot"
; A nest is bigger than a small foe: the brighter rim (ART_DIRECTION §1.3).
rim = "elite"
; Two dim eyes in the largest pod; the seams glow too, so only the two biggest bright spots count.
eyes = 2
; A thing, not a creature: no sway or bob.
sway = false

[cells]
r0c0 = "skip"
r0c1 = "skip"
r0c2 = "skip"
r0c3 = "skip"
r1c0 = "idle"
r1c1 = "windup"
r1c2 = "attack"
r1c3 = "death"

; Dormant: a slow 4-frame pulse is drawn by hand later; for now the key pose held, plus its hurt flash.
[pose.base.idle]
rule = "hold"
derive = ["hurt"]

[pose.base.attack]
rule = "hold"
derive = []

[anim.idle]
fps = 3.0
loop = true

[anim.windup]
fps = 8.0
loop = false

[anim.attack]
fps = 10.0
loop = false

[anim.death]
fps = 10.0
loop = false
