; The Ashbrood, the Hollow's guardian (ART_DIRECTION §2.5): 48 x 48, foot anchor, one 2 x 4 key-pose sheet.
;   godot --headless --path . -s tools/art/sprite_from_sheet.gd -- <sheet.jpg> tools/art/manifests/ashbrood.cfg
; Layout (tools/art/samples/ashbrood_keyposes_grid.jpg):
;   row 1, in the stone bowl: idle (brooding over the last ember), puff wind-up (wings raised), puff release
;          (the ash ring), dive wind-up (crouched)
;   row 2: dive (a streak), recover (slumped: the open window), phase rise (between phases), death (an ash heap)
; The poses overlap in x (a wing reaches under the next pose), so cells are found as connected shapes
; (layout = "components"): the biggest shapes in each row are the poses, and smaller ones (the ash ring's pieces,
; flames) join the nearest pose.
; Colour: role "creature" (the darks, the world blues, #a3bcd4). Bone #d8d2c4 and grey stone #9a958c are
; "special": used only by the recolour rules below, for the skull and the bowl, never for the ashen body. Foes never glow amber (§1.4): the one exception is the WayLamp's last ember in the
; bowl (owner, 2026-11-27): in the three bowl poses, fire-coloured pixels keep the ambers (warm = "ember").
; The phase-rise cell is cold only: its orange flames snap to the blues.

[sheet]
subject = "ashbrood"
kind = "creature"
layout = "components"
rows = 2
cols = 4
frame_size = 48
anchor = "foot"
facing = "right"
rim = "elite"
role = "creature"
special = ["bone", "stone"]
; The skull is drawn bone-beige: it goes to bone #d8d2c4 (its dark sockets and shading stay dark).
recolour = {"beige": ["#d8d2c4"]}
; No pale eye pair on this sheet (the skull's sockets are dark): no eye repair.
eyes = 0
sway = false

[cells]
r0c0 = "idle"
r0c1 = "windup_puff"
r0c2 = "attack_puff"
r0c3 = "windup_dive"
r1c0 = "attack_dive"
r1c1 = "recover"
r1c2 = "phase_rise"
r1c3 = "death"

; The bowl poses. The last ember: amber only for fire-coloured pixels. The sheet draws the bowl in the same slate
; blue as the body, so colour can't tell them apart: the lit pixels in each cell's bowl band (y from the bowl's
; rim down, fractions of the cell, read off this sheet) go to grey stone #9a958c; its shadows stay dark.
; Anything else in that band (a draped wing tip) goes grey too: touch it up in Pixelorama.
[cell.r0c0]
warm = "ember"
recolour = {"beige": ["#d8d2c4"], "lit": ["#9a958c"]}
recolour_regions = {"lit": [0.0, 0.6, 1.0, 1.0]}

[cell.r0c1]
warm = "ember"
recolour = {"beige": ["#d8d2c4"], "lit": ["#9a958c"]}
recolour_regions = {"lit": [0.0, 0.7, 1.0, 1.0]}

[cell.r0c2]
warm = "ember"
recolour = {"beige": ["#d8d2c4"], "lit": ["#9a958c"]}
recolour_regions = {"lit": [0.0, 0.63, 1.0, 1.0]}

[cell.r0c3]
recolour = {"beige": ["#d8d2c4"], "lit": ["#9a958c"]}
recolour_regions = {"lit": [0.0, 0.68, 1.0, 1.0]}

; Phase rise: cold only (no bone or stone either), so the flames can't turn grey or beige.
[cell.r1c2]
special = []
recolour = {}

; Idle: the slow bob; it derives only its hurt flash (death and the dive's wind-up are keyed).
[pose.base.idle]
derive = ["hurt"]

; The puff release is the ring itself: held, no lean (a lean would move the ring). Fit by itself, so the wide
; ring doesn't shrink every other pose.
[pose.base.attack_puff]
rule = "hold"
fit = "own"
derive = []

; The dive streak is long: fit it by itself, held.
[pose.base.attack_dive]
rule = "hold"
fit = "own"
derive = []

[pose.base.phase_rise]
rule = "hold"

[pose.base.death]
rule = "hold"

[anim.idle]
fps = 5.0
loop = true

[anim.windup_puff]
fps = 8.0
loop = false
timed_by = "kl_ashbrood_puff_tell"

[anim.attack_puff]
fps = 12.0
loop = false

[anim.windup_dive]
fps = 8.0
loop = false
timed_by = "kl_ashbrood_dive_tell"

[anim.attack_dive]
fps = 14.0
loop = false

[anim.recover]
fps = 4.0
loop = true

[anim.phase_rise]
fps = 8.0
loop = false

[anim.death]
fps = 10.0
loop = false
