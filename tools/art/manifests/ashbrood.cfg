; The Ashbrood, the Hollow's guardian (ART_DIRECTION §2.5): 48 x 48, one 2 x 4 key-pose sheet.
;   godot --headless --path . -s tools/art/sprite_from_sheet.gd -- <sheet.jpg> tools/art/manifests/ashbrood.cfg
; Ask for (one cell each, facing right):
;   row 1: idle in the bowl (wings folded over the ember), puff wind-up (wings up, body swollen), puff release,
;          calling the brood (head up)
;   row 2: dive wind-up (crouched, wings back), dive (a streak), sitting on a snuffed lamp (slumped), skip
; No sheet yet; this layout is a proposal. The last ember under its wings is the WayLamp's light, not the
; creature's: amber is allowed for this subject only for that glow (palette = all).

[sheet]
subject = "ashbrood"
kind = "creature"
rows = 2
cols = 4
frame_size = 48
anchor = "foot"
facing = "right"
rim = "elite"
eyes = 2
palette = "all"
; Ash is lighter than the Wicklings: no sway, a slow heavy bob.
sway = false

[cells]
r0c0 = "idle"
r0c1 = "windup_puff"
r0c2 = "attack_puff"
r0c3 = "windup_adds"
r1c0 = "windup_dive"
r1c1 = "attack_dive"
r1c2 = "recover"
r1c3 = "skip"

; The dive streak is long: fit it by itself.
[pose.base.attack_dive]
fit = "own"

[anim.idle]
fps = 5.0
loop = true

[anim.windup_puff]
fps = 8.0
loop = false
timed_by = "kl_ashbrood_puff_tell"

[anim.attack_puff]
fps = 12.0
loop = false

[anim.windup_dive]
fps = 8.0
loop = false
timed_by = "kl_ashbrood_dive_tell"

[anim.attack_dive]
fps = 14.0
loop = false

[anim.recover]
fps = 4.0
loop = true
